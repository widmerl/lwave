; L-wave firmware — PlatformIO project.
; Open the "firmware" folder in VS Code with the PlatformIO extension, then
; Build / Upload. The portable code lives in lib/lwave; Teensy-only code in src/.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; Serial, MIDI etc. — plain USB serial is all the firmware needs for now.
build_flags = -D USB_SERIAL -O2
monitor_speed = 115200
